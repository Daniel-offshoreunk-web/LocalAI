# Production deployment — same application, scaled backing services.
# Usage:
#   DEPLOY_PROFILE=production docker compose -f docker-compose.production.yml up -d
#
# Prerequisites: TLS reverse proxy (Caddy/Traefik), Postgres, Redis, vLLM or Ollama GPU node.
# See docs/REPLICATE.md § Production deployment.

services:
  gateway:
    build: .
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    volumes:
      - eps-data:/var/lib/eps
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR_DB: /var/lib/eps/orchestrator.db
      INFERENCE_URL: ${INFERENCE_URL:-http://localai:8080}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    depends_on:
      localai:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gateway_net
      - internal

  admin:
    build: .
    restart: always
    command: ["python", "-m", "src.main", "admin"]
    network_mode: host
    env_file: .env
    volumes:
      - eps-data:/var/lib/eps
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR_DB: /var/lib/eps/orchestrator.db

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal
    volumes:
      - redis-data:/data

  localai:
    image: localai/localai:latest-aio-gpu-nvidia-cuda-12
    restart: always
    environment:
      LOCALAI_API_KEY: ${INFERENCE_API_KEY:-}
    volumes:
      - localai-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - internal

networks:
  gateway_net:
    name: gateway_net
    driver: bridge
  internal:
    driver: bridge

volumes:
  eps-data:
  redis-data:
  localai-models:
