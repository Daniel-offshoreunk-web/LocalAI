# Pilot deployment — single host, 5–10 students.
# Usage:
#   cp .env.example .env && ./scripts/generate-secrets.sh >> .env
#   docker compose -f docker-compose.pilot.yml up -d --build
#
# Admin panel: SSH to host, then curl http://127.0.0.1:8888/ with header X-Admin-Secret

services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - eps-data:/var/lib/eps
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR_DB: /var/lib/eps/orchestrator.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway_net

  admin:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "src.main", "admin"]
    network_mode: host
    env_file: .env
    volumes:
      - eps-data:/var/lib/eps
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR_DB: /var/lib/eps/orchestrator.db
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: ${ADMIN_PORT:-8888}

networks:
  gateway_net:
    name: gateway_net
    driver: bridge

volumes:
  eps-data:
